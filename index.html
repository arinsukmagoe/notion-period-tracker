<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloom Cycle</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="widget">

    <button class="settings-btn" id="settingsBtn" aria-label="Settings">
        ⚙
    </button>

    <div class="flower">
        🌸
    </div>

    <h1>Bloom Cycle</h1>

    <div class="countdown" id="countdown">
        --
    </div>

    <div class="subtitle">
        until next period
    </div>

    <div class="next-date" id="nextDate">
        Set up your cycle
    </div>

</div>


<!-- Overlay -->
<div class="overlay hidden" id="overlay">

    <div class="popup">

        <h2>🌸 Bloom Cycle</h2>

        <p class="popup-desc">
            Personalize your cycle.
        </p>

        <div class="field">

            <label>
                Last Period
            </label>

            <input
                type="date"
                id="lastPeriod">

        </div>


        <div class="field">

            <label>
                Cycle Length
            </label>

            <input
                type="number"
                id="cycleLength"
                min="21"
                max="40"
                value="28">

        </div>


        <div class="button-group">

            <button
                id="cancelBtn"
                class="secondary">

                Cancel

            </button>

            <button
                id="saveBtn"
                class="primary">

                Save

            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
