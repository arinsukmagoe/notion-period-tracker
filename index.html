<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bloom Cycle</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="card">

    <button class="settings" id="settings">
        ⚙
    </button>

    <div class="flower">🌸</div>

    <h2>Bloom Cycle</h2>

    <div class="countdown" id="countdown">
        17 Days
    </div>

    <div class="subtitle">
        until next period
    </div>

    <div class="next" id="nextDate">
        Next • Aug 20
    </div>

</div>

<div class="overlay" id="overlay">

    <div class="popup">

        <h3>🌸 Bloom Cycle</h3>

        <label>Last Period</label>
        <input type="date" id="lastPeriod">

        <label>Cycle Length</label>
        <input
            type="number"
            id="cycleLength"
            value="28"
            min="21"
            max="40">

        <div class="buttons">

            <button id="cancel">
                Cancel
            </button>

            <button id="save">
                Save
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
